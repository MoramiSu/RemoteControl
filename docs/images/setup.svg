<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>setup</title><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><rect x="0" y="0" width="1200" height="560" rx="24" fill="#0b1424" stroke="#0b1424"/><text x="52" y="54" font-size="16" fill="#86a3cb" font-weight="600">QUICK START  /  首次配置示意</text><text x="52" y="109" font-size="38" fill="#ffffff" font-weight="700">从双击启动，到飞书配对。</text><text x="52" y="151" font-size="21" fill="#a8bdd9" font-weight="400">先准备飞书应用，并在家中电脑打开已登录的 Codex。</text><rect x="52" y="203" width="238" height="224" rx="20" fill="#152238" stroke="#2d405c"/><text x="76" y="246" font-size="26" fill="#75d9ff" font-weight="700">01</text><text x="76" y="292" font-size="27" fill="#ffffff" font-weight="600">双击启动</text><text x="76" y="338" font-size="19" fill="#c8d9ef" font-weight="400">Start.cmd</text><text x="76" y="389" font-size="16" fill="#a8bdd9" font-weight="400">自动准备环境和依赖</text><path d="M302 309h22l-6 -6m6 6l-6 6" fill="none" stroke="#75d9ff" stroke-width="2"/><rect x="338" y="203" width="238" height="224" rx="20" fill="#152238" stroke="#2d405c"/><text x="362" y="246" font-size="26" fill="#75d9ff" font-weight="700">02</text><text x="362" y="292" font-size="27" fill="#ffffff" font-weight="600">输入凭据</text><text x="362" y="338" font-size="19" fill="#c8d9ef" font-weight="400">App ID / Secret</text><text x="362" y="389" font-size="16" fill="#a8bdd9" font-weight="400">密钥仅在本机输入</text><path d="M588 309h22l-6 -6m6 6l-6 6" fill="none" stroke="#75d9ff" stroke-width="2"/><rect x="624" y="203" width="238" height="224" rx="20" fill="#152238" stroke="#2d405c"/><text x="648" y="246" font-size="26" fill="#75d9ff" font-weight="700">03</text><text x="648" y="292" font-size="27" fill="#ffffff" font-weight="600">选择会话</text><text x="648" y="338" font-size="19" fill="#c8d9ef" font-weight="400">按任务编号选择</text><text x="648" y="389" font-size="16" fill="#a8bdd9" font-weight="400">自动发现并核验身份</text><path d="M874 309h22l-6 -6m6 6l-6 6" fill="none" stroke="#75d9ff" stroke-width="2"/><rect x="910" y="203" width="238" height="224" rx="20" fill="#152238" stroke="#2d405c"/><text x="934" y="246" font-size="26" fill="#75d9ff" font-weight="700">04</text><text x="934" y="292" font-size="27" fill="#ffffff" font-weight="600">飞书配对</text><text x="934" y="338" font-size="19" fill="#c8d9ef" font-weight="400">发送 /rc pair …</text><text x="934" y="389" font-size="16" fill="#a8bdd9" font-weight="400">再发一条无害任务验收</text><text x="52" y="485" font-size="20" fill="#81e5bd" font-weight="400">后续复用配置和配对 · 可选 Windows 登录后自动启动</text><text x="52" y="522" font-size="17" fill="#a8bdd9" font-weight="400">飞书应用创建、权限和发布，仍需在开放平台完成。</text></g></svg>