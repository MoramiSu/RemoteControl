<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>scenario</title><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><rect x="0" y="0" width="1200" height="560" rx="24" fill="#0b1424" stroke="#0b1424"/><text x="52" y="54" font-size="16" fill="#86a3cb" font-weight="600">REMOTECONTROL  /  使用场景示意</text><text x="52" y="114" font-size="38" fill="#ffffff" font-weight="700">人在公司，家里的 Codex 在替你干活。</text><text x="52" y="157" font-size="22" fill="#a8bdd9" font-weight="400">飞书发需求 · 家中原会话执行 · 结果回到手边</text><rect x="52" y="206" width="390" height="260" rx="20" fill="#152238" stroke="#2d405c"/><text x="78" y="247" font-size="24" fill="#75d9ff" font-weight="700">你 · 飞书私聊</text><rect x="78" y="272" width="338" height="64" rx="20" fill="#203956" stroke="#2d405c"/><text x="98" y="312" font-size="18" fill="#dbe6fa" font-weight="400">接着昨天的项目，完善安装步骤。</text><rect x="78" y="352" width="338" height="78" rx="20" fill="#192e3d" stroke="#2d405c"/><text x="98" y="384" font-size="19" fill="#81e5bd" font-weight="600">收到任务结果</text><text x="98" y="412" font-size="17" fill="#b5ccde" font-weight="400">说明文字、图表和输出文件</text><rect x="744" y="206" width="404" height="260" rx="20" fill="#152238" stroke="#2d405c"/><text x="770" y="247" font-size="24" fill="#81e5bd" font-weight="700">家中电脑 · Codex</text><rect x="770" y="273" width="352" height="155" rx="20" fill="#0d1a2a" stroke="#2d405c"/><text x="791" y="310" font-size="23" fill="#ffffff" font-weight="600">原来的会话，接着做</text><text x="791" y="348" font-size="17" fill="#b5ccde" font-weight="400">保留上下文 · 使用本机项目文件</text><text x="791" y="389" font-size="17" fill="#b5ccde" font-weight="400">本地登录运行，电脑保持唤醒</text><text x="480" y="289" font-size="24" fill="#ffffff" font-weight="600">RemoteControl</text><text x="502" y="321" font-size="20" fill="#a8bdd9" font-weight="400">本地桥接</text><path d="M460 349H719l-10 -7m10 7l-10 7M719 390H460l10 -7m-10 7l10 7" fill="none" stroke="#66d6ed" stroke-width="3"/><text x="533" y="376" font-size="16" fill="#a8bdd9" font-weight="400">任务 / 结果</text><text x="52" y="516" font-size="19" fill="#81e5bd" font-weight="400">无需公网端口或内网穿透</text><text x="620" y="516" font-size="19" fill="#81e5bd" font-weight="400">家中无需登录飞书客户端</text></g></svg>